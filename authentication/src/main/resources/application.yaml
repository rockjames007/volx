server:
  error:
    include-message: always
  port: 8005
spring:
  application:
    name: authentication-service
  datasource:
    url: jdbc:postgresql://localhost:5432/volx
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
security:
  jwt:
    # Override in any shared/production environment via SECURITY_JWT_SECRET_KEY.
    secret-key: ${SECURITY_JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-time: 3600000
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8999/eureka/
