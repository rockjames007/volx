name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-service/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-service/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build for https://<owner>.github.io/<repository>/
        run: npm run build
        env:
          # Follows the repository name, so renaming the repository just works.
          PUBLIC_URL: /${{ github.event.repository.name }}
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
      # GitHub Pages serves 404.html for unknown paths; making it the app lets
      # links like /<repository>/events/1 open directly.
      - run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-service/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
