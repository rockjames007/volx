server:
  port: 9000
spring:
  cloud:
    gateway:
      routes:
        - id: PROFILE-SERVICE
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/profile/**
        - id: AUTHENTICATION-SERVICE
          uri: lb://AUTHENTICATION-SERVICE
          predicates:
            - Path=/auth/**,/users/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${VOLX_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
  application:
    name: api-gateway
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8999/eureka/
management:
  endpoints:
    web:
      exposure:
        include: "*"
